            <h2>Instructions:</h2>
            <ul>
                <li>Click to freeze rotation.</li>
                <li>Press "z" to expand or contract cube array.</li>
                <li>Press "w" to toggle box wireframes.</li>
                <li>Press "c" to randomize base color.</li>
                <li>Press "l" to randomize light color.</li>
                <li>Press "p" to toggle camera type.</li>
                <li>Press "r" to reset all.</li>
